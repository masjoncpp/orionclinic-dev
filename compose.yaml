services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orionclinic-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      app.baseURL: ${APP_BASE_URL:-http://localhost:8080/}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-orionclinic}
      DB_USERNAME: ${DB_USERNAME:-orionclinic}
      DB_PASSWORD: ${DB_PASSWORD:-orionclinic_dev}
      database.default.hostname: ${DB_HOST:-db}
      database.default.database: ${DB_DATABASE:-orionclinic}
      database.default.username: ${DB_USERNAME:-orionclinic}
      database.default.password: ${DB_PASSWORD:-orionclinic_dev}
      database.default.DBDriver: MySQLi
      database.default.port: ${DB_PORT:-3306}
      database.tests.hostname: ${DB_HOST:-db}
      database.tests.database: ${DB_DATABASE:-orionclinic}
      database.tests.username: ${DB_USERNAME:-orionclinic}
      database.tests.password: ${DB_PASSWORD:-orionclinic_dev}
      database.tests.DBDriver: MySQLi
      database.tests.port: ${DB_PORT:-3306}
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - orion-net

  db:
    image: mariadb:10.11
    container_name: orionclinic-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-orionclinic_root_dev}
      MARIADB_DATABASE: ${DB_DATABASE:-orionclinic}
      MARIADB_USER: ${DB_USERNAME:-orionclinic}
      MARIADB_PASSWORD: ${DB_PASSWORD:-orionclinic_dev}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./orionclinic.sql:/docker-entrypoint-initdb.d/01-orionclinic.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - orion-net

volumes:
  db_data:
  vendor_data:

networks:
  orion-net:
    driver: bridge
